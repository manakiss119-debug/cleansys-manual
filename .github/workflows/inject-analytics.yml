name: Inject analytics and feedback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject script tag into index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="analytics-feedback.js"></script>'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('index.html에 </body>가 없습니다.')
              text = text.replace('</body>', f'  {tag}\n</body>', 1)
              p.write_text(text, encoding='utf-8')
              print('analytics-feedback.js 연결 완료')
          else:
              print('이미 연결되어 있습니다.')

      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect analytics and feedback module"
          git push
